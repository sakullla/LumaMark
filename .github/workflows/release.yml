name: Release extension

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching the manifest version (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - id: version
        name: Check release version
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const manifest = JSON.parse(readFileSync("apps/extension/manifest.chrome.json", "utf8"));
            if (process.env.RELEASE_TAG !== `v${manifest.version}`) {
              throw new Error(`Release tag ${process.env.RELEASE_TAG} must be v${manifest.version}`);
            }
          '
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Package browser extensions
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          for target in chrome firefox safari; do
            if [[ "$target" == "chrome" ]]; then
              name="chrome-edge"
            else
              name="$target"
            fi
            archive="$GITHUB_WORKSPACE/release/lumamark-${name}-${VERSION}.zip"
            (cd "dist/extension/$target" && zip -q -r "$archive" .)
          done
          (cd release && sha256sum *.zip > SHA256SUMS.txt)
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" release/*.zip release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "LumaMark ${RELEASE_TAG#v}" \
            --generate-notes
