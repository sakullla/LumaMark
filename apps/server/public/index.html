<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>LumaMark</title>
  <script>
    try {
      var t = localStorage.getItem('lumamark-theme');
      document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.dataset.accent = localStorage.getItem('lumamark-accent') || 'iris';
    } catch (e) {}
  </script>
  <style>
    html { background: #f6f6f8; color: #18181b; }
    html[data-theme="dark"] { background: #0f0f12; color: #ececf1; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
    .boot { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
    .boot form { display: grid; gap: 12px; width: min(360px, 100%); }
    .boot label { display: grid; gap: 4px; font-size: 13px; }
    .boot input, .boot button { font: inherit; padding: 9px 12px; border-radius: 8px; border: 1px solid #d4d4d8; }
    .boot button { background: #5b5bd6; border-color: transparent; color: #fff; }
    .boot p { margin: 0; font-size: 13px; opacity: .7; }
  </style>
</head>
<body>
  <noscript><p>浏览器没有运行页面脚本，因此这里不显示书签库。</p></noscript>
  <div id="root">
    <div class="boot">
      <form id="login">
        <strong>LumaMark</strong>
        <label>用户名 <input name="username" autocomplete="username" required></label>
        <label>密码 <input name="password" type="password" autocomplete="current-password" required></label>
        <button type="submit">登录</button>
        <p>账号由管理员创建，此页面不能注册。</p>
      </form>
    </div>
  </div>
  <script type="module">
    import { startWebApp } from '/web.js';
    startWebApp();
  </script>
</body>
</html>
