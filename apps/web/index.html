<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>LumaMark</title>
  <script>
    try {
      var t = localStorage.getItem('lumamark-theme');
      document.documentElement.dataset.theme = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.dataset.accent = localStorage.getItem('lumamark-accent') || 'iris';
    } catch (e) {}
  </script>
  <style>
    html { background: #f6f6f8; color: #18181b; }
    html[data-theme="dark"] { background: #0f0f12; color: #ececf1; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; line-height: 1.5; }
  </style>
</head>
<body>
  <noscript><p>浏览器没有运行页面脚本，因此这里不显示书签库。账号由管理员创建，此页面不能注册。</p></noscript>
  <div id="root"></div>
  <script type="module">
    import { startWebApp } from './src/main.ts';
    startWebApp();
  </script>
</body>
</html>
